<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#202026">
  <title>OASX / 每日验收</title>
  <link rel="stylesheet" href="/static/daily-feedback.css?v=20261007">
  <script src="/static/daily-feedback.js?v=20261007" defer></script>
</head>
<body>
  <header class="page-header"><a class="back-link" href="/" aria-label="返回工作台">← 工作台</a><a class="brand" href="/daily-feedback"><img src="/static/assets/oasx.png" width="28" height="28" alt="">每日验收</a><button id="refresh" class="secondary" type="button">刷新</button></header>
  <main>
    <section class="intro"><div><span class="eyebrow">今日结果，一眼确认</span><h1>账号日常验收</h1><p>花合战今日经验 · 寮集体任务 30 次</p></div><div class="date-control"><button id="previous-day" type="button" aria-label="前一天">‹</button><label class="sr-only" for="report-date">验收日期</label><input id="report-date" type="date"><button id="next-day" type="button" aria-label="后一天">›</button><button id="today" class="secondary" type="button">今天</button></div></section>
    <div id="login-notice" class="notice" hidden>当前面板需要登录，请先<a href="/">返回工作台登录</a>。</div>
    <div id="error" class="notice error" role="alert" hidden></div>
    <section id="summary" class="summary" aria-label="验收概况"></section>
    <div class="list-heading"><span>需要关注的账号优先显示</span><span id="refresh-time" role="status">正在读取…</span></div>
    <section id="account-list" class="account-list" aria-label="账号验收列表"><div class="empty">正在读取每日验收记录…</div></section>
    <p class="footnote">截图按账号和日期保存。花合战今日经验用于快速查看活跃进度，不能单独证明每一项任务都已完成；经验可以超过目标，没有可靠画面或数字的项目显示“未核验”。</p>
  </main>
  <dialog id="detail-dialog" class="detail-dialog"><div class="detail-header"><div><span id="detail-date" class="eyebrow"></span><h2 id="detail-account"></h2></div><button id="detail-close" class="secondary" type="button" aria-label="关闭账号详情">关闭 ✕</button></div><div id="detail-body"></div></dialog>
  <dialog id="image-dialog" class="image-dialog"><div class="image-toolbar"><span id="image-label"></span><a id="image-download" class="secondary" download>保存原图</a><button id="image-close" class="secondary" type="button">关闭 ✕</button></div><img id="image-preview" alt="验收游戏截图"></dialog>
</body>
</html>
