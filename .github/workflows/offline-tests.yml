name: Offline regression tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install existing pinned panel dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Run reviewed isolated Python and Node suites
        run: python -X utf8 -B dev_tools/offline_ci.py --report "$env:RUNNER_TEMP/offline-ci.json"
      - name: Preserve results without publishing a release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-test-results
          path: ${{ runner.temp }}/offline-ci.json
          if-no-files-found: warn
